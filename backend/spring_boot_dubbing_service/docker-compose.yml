version: '3.8'

services:
  # 1. MongoDB: Metadata & Segment document storage
  mongodb:
    image: mongo:7.0
    container_name: dubbing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db

  # 2. Redis: Task Queue (Streams/PubSub) & Distributed Lock
  redis:
    image: redis:7.2-alpine
    container_name: dubbing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # 3. MinIO: S3-Compatible Object Storage for video, audio & ASS files
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: dubbing-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. Spring Boot Dubbing Microservice
  dubbing-service:
    build: .
    container_name: dubbing-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password123@mongodb:27017/dubbing_db?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: dubbing-media
    depends_on:
      - mongodb
      - redis
      - minio

volumes:
  mongo_data:
  redis_data:
  minio_data:
